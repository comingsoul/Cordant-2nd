<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2부 초대장 - 카페 헤이랑</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #f2f2f2;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* 초대장 전체 카드 용기 */
    .card-container {
      position: relative;
      width: 100%;
      max-width: 430px;
      margin: 0 auto;
      background: #ffffff;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }

    /* 이미지 화질 선명도 보정 */
    .card-img {
      width: 100%;
      height: auto;
      display: block;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
      transform: translateZ(0);
      backface-visibility: hidden;
    }

    /* 1) 지도 영역 오버레이 */
    .map-overlay {
      position: absolute;
      top: 72.7%;     /* 지도 위치 */
      left: 9.1%;
      width: 81.8%;
      height: 11.8%;
      border-radius: 12px;
      overflow: hidden;
      background: #f7f7f7;
    }
    .map-overlay iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* 2) 버튼 영역 오버레이 */
    .btn-overlay-group {
      position: absolute;
      top: 85.6%;     /* 버튼 위치 */
      left: 9.1%;
      width: 81.8%;
      height: 2.6%;
      display: flex;
      justify-content: space-between;
      gap: 2%;
    }
    .nav-btn {
      flex: 1;
      background: transparent;
      border: none;
      cursor: pointer;
      border-radius: 20px;
      outline: none;
      -webkit-tap-highlight-color: rgba(186, 131, 140, 0.3);
    }
    .nav-btn:active {
      background-color: rgba(186, 131, 140, 0.15);
    }
  </style>
</head>
<body>

  <div class="card-container">
    <!-- 무료 고품질 이미지 호스팅 링크를 적용하여 엑스박스 방지 -->
    <img src="https://i.ibb.co/L5Y4J8g/card-2.jpg" alt="2부 초대장" class="card-img" onerror="this.src='card_2.jpg'">

    <!-- 지도 위치 (경기 수원시 팔달구 창룡문로 110 검색 고정) -->
    <div class="map-overlay">
      <iframe 
        src="https://m.map.kakao.com/actions/searchView?q=%EA%B2%BD%EA%B8%B0%20%EC%88%98%EC%9B%90%EC%8B%9C%20%ED%8C%94%EB%8B%AC%EA%B5%AC%20%EC%B0%BD%EB%A3%A1%EB%AC%B8%EB%A1%9C%20110"
        title="카페 헤이랑 위치 지도">
      </iframe>
    </div>

    <!-- 버튼 터치 영역 (카카오맵 / 네이버지도 / 티맵) -->
    <div class="btn-overlay-group">
      <button class="nav-btn" onclick="openNav('kakao')" title="카카오맵"></button>
      <button class="nav-btn" onclick="openNav('naver')" title="네이버지도"></button>
      <button class="nav-btn" onclick="openNav('tmap')" title="티맵"></button>
    </div>
  </div>

  <script>
    const VENUE_ADDR = '경기 수원시 팔달구 창룡문로 110';

    function openNav(app) {
      const addrQ = encodeURIComponent(VENUE_ADDR);

      if (app === 'kakao') {
        location.href = `https://map.kakao.com/link/search/${addrQ}`;
        return;
      }

      let scheme, web;
      if (app === 'naver') {
        scheme = `nmap://search?query=${addrQ}&appname=wedding.invite`;
        web = `https://map.naver.com/p/search/${addrQ}`;
      } else if (app === 'tmap') {
        scheme = `tmap://search?name=${addrQ}`;
        web = `https://www.tmap.co.kr/`;
      }

      const startTime = Date.now();
      setTimeout(() => {
        if (Date.now() - startTime < 1800) {
          location.href = web;
        }
      }, 1200);

      location.href = scheme;
    }
  </script>
</body>
</html>
